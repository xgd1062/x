    <style>
        /* CSS 变量管理色彩 - 默认日间模式 */
        :root {
            --bg-main: linear-gradient(to right top, #65dfc9, #6cdbeb);
            --card-bg-abc: transparent;
            --btn-bg-abc: rgba(255, 255, 255, 0.85);
            --text-abc: #2c5282;

            --card-bg-bbc: transparent;
            --btn-bg-bbc: #ffffff;
            --text-bbc: #2c5282;

            --card-bg-ed: linear-gradient(to right bottom, rgba(195, 224, 231, 0.7), rgba(190, 224, 208, 0.7));
            --btn-bg-ed1: #d4eaee;
            --btn-bg-ed2: #e2f2f6;
            --text-ed: #426691;

            --card-bg-dd: #f9e8d0;
            --btn-bg-dd: #8fb2c9;
            --text-dd: #ffffff;

            --text-yiyan: #d4acad;
            --bg-yiyan-span: #b2d7e9;
            --text-yiyan-span: #000000;

            --text-link: #000000;
            --text-link-hover: #ffffff;

            --toggle-bg: rgba(255, 255, 255, 0.85);
            --toggle-color: #333333;
        }

        /* 夜晚模式 (Dark Mode) */
        body.dark-mode {
            --bg-main: linear-gradient(to right top, #0f2027, #203a43, #2c5364);
            --card-bg-abc: transparent;
            --btn-bg-abc: rgba(30, 41, 59, 0.85);
            --text-abc: #93c5fd;

            --card-bg-bbc: transparent;
            --btn-bg-bbc: #1e293b;
            --text-bbc: #38bdf8;

            --card-bg-ed: linear-gradient(to right bottom, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.6));
            --btn-bg-ed1: #334155;
            --btn-bg-ed2: #1e293b;
            --text-ed: #cbd5e1;

            --card-bg-dd: rgba(30, 41, 59, 0.8);
            --btn-bg-dd: #475569;
            --text-dd: #f1f5f9;

            --text-yiyan: #94a3b8;
            --bg-yiyan-span: #334155;
            --text-yiyan-span: #f1f5f9;

            --text-link: #e2e8f0;
            --text-link-hover: #38bdf8;

            --toggle-bg: rgba(30, 41, 59, 0.9);
            --toggle-color: #fbbf24;
        }

        /* 基础重置 */
        * {
            padding: 0;
            margin: 0;
            border: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        a {
            text-decoration: none;
            color: var(--text-link);
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--text-link-hover);
        }

        /* 夜晚模式切换按钮样式 */
        .dark-mode-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 999;
            background: var(--toggle-bg);
            color: var(--toggle-color);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.3s ease;
        }

        .dark-mode-toggle:hover {
            transform: scale(1.1);
        }

        /* 主容器布局 */
        .main {
            background: var(--bg-main);
            min-height: 100vh;
            padding-top: 20px;
            padding-bottom: 30px;
            position: relative;
            transition: background 0.3s ease;
            overflow-x: hidden;
        }

        /* ==================== 第一部分：自适应文本长度流式布局 ==================== */
        .abc {
            width: 90%;
            max-width: 1200px;
            margin: 10px auto 20px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px 14px;
            align-items: center;
        }

        .abc-card {
            position: relative;
            background: var(--btn-bg-abc);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            height: 70px;
            padding: 0 24px;
            /* 根据文字自动延伸边距 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-grow: 1;
            /* 充填剩余空间让边缘平整 */
            max-width: 100%;
        }

        .abc-card h2 {
            font-size: 18px;
            color: var(--text-abc);
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
            white-space: nowrap;
            /* 保持单行自适应 */
            z-index: 2;
        }

        @media (hover: hover) and (pointer: fine) {
            .abc-card:hover {
                transform: scale(1.06) rotate(0deg) translateY(-4px) !important;
                box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
                z-index: 10;
                background: rgba(255, 255, 255, 0.98);
            }

            body.dark-mode .abc-card:hover {
                background: rgba(30, 41, 59, 0.98);
            }
        }

        /* 调换后的顺序与个性化外形/倾斜度 */
        .abc-card.c1 {
            order: 1;
            transform: rotate(-2deg);
            border-radius: 22px 12px 20px 14px;
        }

        .abc-card.c2 {
            order: 2;
            transform: rotate(1.5deg);
            border-radius: 14px 24px 14px 22px;
        }

        .abc-card.c7 {
            order: 3;
            transform: rotate(-1.8deg);
            border-radius: 20px 16px 26px 12px;
        }

        .abc-card.c3 {
            order: 4;
            transform: rotate(2deg);
            border-radius: 16px 22px 12px 20px;
        }

        .abc-card.c4 {
            order: 5;
            transform: rotate(-1deg);
            border-radius: 26px 14px 20px 24px;
            background: linear-gradient(135deg, var(--btn-bg-abc), rgba(255, 255, 255, 0.6));
            flex-grow: 2;
            /* 较长文字占更大比例 */
        }

        .abc-card.c4 h2 {
            color: var(--text-bbc);
            font-size: 19px;
        }

        .abc-card.c6 {
            order: 6;
            transform: rotate(2.5deg);
            border-radius: 22px 14px 24px 16px;
        }

        .abc-card.c5 {
            order: 7;
            transform: rotate(-2deg);
            border-radius: 12px 20px 14px 22px;
        }

        .abc-card.c8 {
            order: 8;
            transform: rotate(1deg);
            border-radius: 18px 24px 14px 20px;
        }

        .abc-card.c11 {
            order: 9;
            transform: rotate(-2.5deg);
            border-radius: 16px 22px 12px 20px;
        }

        .abc-card.c9 {
            order: 10;
            transform: rotate(1.5deg);
            border-radius: 14px 20px 18px 22px;
        }

        .abc-card.c10 {
            order: 11;
            transform: rotate(-1deg);
            border-radius: 22px 12px 20px 12px;
        }

        /* 第二部分：贴画风格文字标识栏 */
        .bbc {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 10px;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .bbc span {
            flex: 1;
            max-width: 180px;
            height: 62px;
            line-height: 54px;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: var(--text-bbc);
            background-color: var(--btn-bg-bbc);
            border: 4px solid #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12), inset 0 -3px 0 rgba(0, 0, 0, 0.08);
            user-select: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }

        .bbc span:nth-child(1) {
            transform: rotate(-4deg);
            background: #ffbe0b;
            color: #5c3d00;
        }

        .bbc span:nth-child(2) {
            transform: rotate(3deg);
            background: #ff006e;
            color: #ffffff;
        }

        .bbc span:nth-child(3) {
            transform: rotate(-2deg);
            background: #8338ec;
            color: #ffffff;
        }

        .bbc span:nth-child(4) {
            transform: rotate(4deg);
            background: #3a86ff;
            color: #ffffff;
        }

        .bbc span:nth-child(5) {
            transform: rotate(-3deg);
            background: #06d6a0;
            color: #004d38;
        }

        body.dark-mode .bbc span {
            border-color: #334155;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        @media (hover: hover) and (pointer: fine) {
            .bbc span:hover {
                transform: scale(1.15) rotate(0deg) translateY(-6px) !important;
                box-shadow: 0 14px 24px rgba(0, 0, 0, 0.2), inset 0 -3px 0 rgba(0, 0, 0, 0.1);
                z-index: 5;
            }
        }

        /* 第三部分：分组链接区 */
        .ed {
            background: var(--card-bg-ed);
            border-radius: 1rem;
            width: 90%;
            max-width: 1200px;
            margin: 15px auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background 0.3s ease;
        }

        .ed-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .ed-row a {
            flex: 1;
            height: 42px;
            line-height: 42px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 15px;
            color: var(--text-ed);
            background-color: var(--btn-bg-ed1);
            padding: 0 4px;
            transition: background-color 0.3s ease;
        }

        .ed-row.ed2 a {
            background-color: var(--btn-bg-ed2);
        }

        /* 第四部分：底部链接区 */
        .dd {
            margin: 0 auto;
            padding: 12px;
            width: 85%;
            max-width: 1100px;
            background: var(--card-bg-dd);
            border-radius: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 8px;
            transition: background 0.3s ease;
        }

        .dd a {
            background-color: var(--btn-bg-dd);
            color: var(--text-dd);
            border-radius: 1rem;
            line-height: 30px;
            padding: 2px 16px;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        /* 诗词挂载 */
        .yiyan {
            font-size: 18px;
            color: var(--text-yiyan);
            width: 90%;
            margin: 16px auto 0;
            text-align: center;
            line-height: 1.6;
        }

        .yiyan span {
            background: var(--bg-yiyan-span);
            color: var(--text-yiyan-span);
            padding: 6px 16px;
            border-radius: 12px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        /* 浮动背景圆圈 */
        .t1,
        .t2,
        .t3 {
            background: linear-gradient(to right bottom, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.3));
            height: 5rem;
            width: 5rem;
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        body.dark-mode .t1,
        body.dark-mode .t2,
        body.dark-mode .t3 {
            opacity: 0.2;
        }

        .t1 {
            top: 16px;
            right: 23px;
        }

        .t2 {
            top: 202px;
            left: 45px;
        }

        .t3 {
            top: 322px;
            right: 70px;
        }

        /* 二维码定位 */
        .qr-code {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100px;
            border-radius: 20px;
            z-index: 10;
        }

        .qr-code img {
            width: 100%;
            display: block;
            border-radius: inherit;
        }

        /* ==================== 移动端适配 (Mobile Viewport) ==================== */
        @media screen and (max-width: 768px) {
            .main {
                padding-top: 60px;
                padding-bottom: 20px;
            }

            .dark-mode-toggle {
                top: 12px;
                right: 12px;
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .qr-code {
                top: 12px;
                left: 12px;
                width: 56px;
                border-radius: 12px;
            }

            /* 第一部分移动端自适应 */
            .abc {
                width: 94%;
                gap: 10px 8px;
                padding: 4px;
                margin-bottom: 12px;
            }

            .abc-card {
                height: 54px;
                padding: 0 16px;
                border-radius: 12px !important;
                transform: none !important;
                flex-grow: 1;
            }

            .abc-card h2 {
                font-size: 14px !important;
            }

            /* 第二部分：贴画移动端适配 */
            .bbc {
                width: 94%;
                gap: 6px;
                padding: 0;
                margin: 12px auto;
            }

            .bbc span {
                height: 42px;
                line-height: 36px;
                font-size: 15px;
                border-width: 3px;
                border-radius: 12px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }

            .bbc span:nth-child(1) {
                transform: rotate(-2deg);
            }

            .bbc span:nth-child(2) {
                transform: rotate(1.5deg);
            }

            .bbc span:nth-child(3) {
                transform: rotate(-1deg);
            }

            .bbc span:nth-child(4) {
                transform: rotate(2deg);
            }

            .bbc span:nth-child(5) {
                transform: rotate(-1.5deg);
            }

            /* 第三部分：分组链接三列适配 */
            .ed {
                width: 94%;
                padding: 10px;
                gap: 8px;
                margin: 10px auto;
            }

            .ed-row {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }

            .ed-row a {
                height: 38px;
                line-height: 38px;
                font-size: 12px;
                border-radius: 10px;
            }

            /* 第四部分：底部标签适配 */
            .dd {
                width: 94%;
                padding: 10px 8px;
                gap: 6px;
            }

            .dd a {
                font-size: 12px;
                line-height: 24px;
                padding: 2px 10px;
                border-radius: 8px;
            }

            /* 一言与装饰 */
            .yiyan {
                font-size: 14px;
                width: 94%;
                margin-top: 12px;
            }

            .yiyan span {
                padding: 4px 12px;
                border-radius: 8px;
            }

            .t1,
            .t2,
            .t3 {
                display: none;
            }
        }
    </style>
</head>
