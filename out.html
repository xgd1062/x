    <title>软件收藏页</title>

    <style>
        /* CSS 变量管理色彩 - 默认日间模式 */
        :root {
            --bg-main: linear-gradient(to right top, #65dfc9, #6cdbeb);
            --card-bg-abc: linear-gradient(to right bottom, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.3));
            --btn-bg-abc: antiquewhite;
            --text-abc: #658ec6;

            --card-bg-bbc: linear-gradient(to right bottom, rgba(170, 161, 206, 0.5), rgba(237, 236, 246, 0.7));
            --btn-bg-bbc: #dce3f3;
            --text-bbc: #2775b6;

            --card-bg-ed: linear-gradient(to right bottom, rgba(195, 224, 231, 0.7), rgba(190, 224, 208, 0.7));
            --btn-bg-ed1: #d4eaee;
            --btn-bg-ed2: #e2f2f6;
            --text-ed: #426691;

            --card-bg-dd: #f9e8d0;
            --btn-bg-dd: #8fb2c9;
            --text-dd: #ffffff;

            --text-yiyan: #d4acad;
            --bg-yiyan-span: #b2d7e9;
            --text-yiyan-span: #000000;

            --text-link: #000000;
            --text-link-hover: #ffffff;

            --toggle-bg: rgba(255, 255, 255, 0.8);
            --toggle-color: #333333;
        }

        /* 夜晚模式 (Dark Mode) */
        body.dark-mode {
            --bg-main: linear-gradient(to right top, #0f2027, #203a43, #2c5364);
            --card-bg-abc: linear-gradient(to right bottom, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.6));
            --btn-bg-abc: #1e293b;
            --text-abc: #93c5fd;

            --card-bg-bbc: linear-gradient(to right bottom, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.6));
            --btn-bg-bbc: #334155;
            --text-bbc: #60a5fa;

            --card-bg-ed: linear-gradient(to right bottom, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.6));
            --btn-bg-ed1: #334155;
            --btn-bg-ed2: #1e293b;
            --text-ed: #cbd5e1;

            --card-bg-dd: rgba(30, 41, 59, 0.8);
            --btn-bg-dd: #475569;
            --text-dd: #f1f5f9;

            --text-yiyan: #94a3b8;
            --bg-yiyan-span: #334155;
            --text-yiyan-span: #f1f5f9;

            --text-link: #e2e8f0;
            --text-link-hover: #38bdf8;

            --toggle-bg: rgba(30, 41, 59, 0.9);
            --toggle-color: #fbbf24;
        }

        /* 基础重置 */
        * {
            padding: 0;
            margin: 0;
            border: 0;
            box-sizing: border-box;
        }

        a {
            text-decoration: none;
            color: var(--text-link);
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--text-link-hover);
        }

        /* 夜晚模式切换按钮样式 */
        .dark-mode-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 999;
            background: var(--toggle-bg);
            color: var(--toggle-color);
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .dark-mode-toggle:hover {
            transform: scale(1.1);
        }

        /* 主容器布局 */
        .main {
            background: var(--bg-main);
            min-height: 100vh;
            padding-top: 16px;
            padding-bottom: 20px;
            position: relative;
            transition: background 0.3s ease;
        }

        /* 第一部分：三行随机长度布局 */
        .abc {
            width: 90%;
            margin: 0 auto;
            padding: 12px 15px;
            background: var(--card-bg-abc);
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background 0.3s ease;
        }

        .abc-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .abc-row a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 50px;
            background-color: var(--btn-bg-abc);
            border-radius: 25px;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .abc-row h2 {
            font-size: 26px;
            color: var(--text-abc);
            font-weight: normal;
            white-space: nowrap;
        }

        /* 长短错落修饰类 */
        .abc-row .w-sm {
            padding: 0 18px;
            flex-grow: 1;
            max-width: 160px;
        }

        .abc-row .w-md {
            padding: 0 30px;
            flex-grow: 2;
            max-width: 260px;
        }

        .abc-row .w-lg {
            padding: 0 45px;
            flex-grow: 3;
            max-width: 380px;
        }

        /* 中部欢迎栏 */
        .bbc {
            width: 90%;
            margin: 10px auto 0;
            padding: 6px 10px;
            background: var(--card-bg-bbc);
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            gap: 1%;
            transition: background 0.3s ease;
        }

        .bbc a {
            flex: 1;
            height: 60px;
            line-height: 60px;
            background-color: var(--btn-bg-bbc);
            text-align: center;
            font-size: 30px;
            border-radius: 15px;
            color: var(--text-bbc);
            transition: background-color 0.3s ease;
        }

        /* 分组链接区 */
        .ed {
            background: var(--card-bg-ed);
            border-radius: 1rem;
            margin: 10px 5%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background 0.3s ease;
        }

        .ed-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .ed-row a {
            flex: 1;
            height: 35px;
            line-height: 35px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9em;
            border-radius: 15px;
            color: var(--text-ed);
            background-color: var(--btn-bg-ed1);
            transition: background-color 0.3s ease;
        }

        .ed-row.ed2 a {
            background-color: var(--btn-bg-ed2);
        }

        /* 底部链接区 */
        .dd {
            margin: 0 auto;
            padding: 10px;
            width: 80%;
            background: var(--card-bg-dd);
            border-radius: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s ease;
        }

        .dd a {
            background-color: var(--btn-bg-dd);
            color: var(--text-dd);
            border-radius: 1rem;
            line-height: 25px;
            padding: 2px 10px;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        /* 诗词挂载 */
        .yiyan {
            font-size: 18px;
            color: var(--text-yiyan);
            width: 100%;
            text-align: center;
            margin-top: 12px;
        }

        .yiyan span {
            background: var(--bg-yiyan-span);
            color: var(--text-yiyan-span);
            padding: 2px 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        /* 浮动背景圆圈 */
        .t1,
        .t2,
        .t3 {
            background: linear-gradient(to right bottom, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.3));
            height: 5rem;
            width: 5rem;
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        body.dark-mode .t1,
        body.dark-mode .t2,
        body.dark-mode .t3 {
            opacity: 0.2;
        }

        .t1 {
            top: 16px;
            right: 23px;
        }

        .t2 {
            top: 202px;
            left: 45px;
        }

        .t3 {
            top: 322px;
            right: 70px;
        }

        /* 二维码定位 */
        .qr-code {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 24%;
            max-width: 120px;
            border-radius: 25px;
        }

        .qr-code img {
            width: 100%;
            display: block;
            border-radius: inherit;
        }

        /* 移动端适配 */
        @media screen and (max-width: 600px) {
            .abc-row {
                flex-wrap: wrap;
            }

            .abc-row a {
                width: 100%;
                max-width: none !important;
            }

            .qr-code {
                border-radius: 10%;
            }

            .dd {
                text-align: center;
            }

            .dd a {
                white-space: nowrap;
            }
        }
    </style>
</head>

    <!-- 夜晚模式切换 JS -->
    <script>
        const btn = document.getElementById('darkModeBtn');

        // 读取本地存储模式状态
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            btn.textContent = '☀️';
        }

        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            btn.textContent = isDark ? '☀️' : '🌙';
